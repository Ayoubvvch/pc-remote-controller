name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk PCRemote-v1.2.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-APK
          path: PCRemote-v1.2.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.2.0
          name: "PC Remote App v1.2.0"
          body: |
            ### 🚀 PC Remote Control Android App (Release v1.2.0)
            - 📸 **لقطة شاشة (Screenshot):** التقاط شاشة الحاسوب وعرضها في المحادثة مباشرة مع معاينة بالحجم الكامل.
            - 📁 **إرسال الملفات والصور:** إرسال أي صورة أو مستند أو ملف من الهاتف إلى مجلد التنزيلات (Downloads) في الحاسوب فوراً.
            - 💤 **جدولة السكون:** دعم أوامر مثل `sleep 15` و `sleep 30`.
            - 🛡️ **تأكيد الأمان:** حماية الأوامر الحساسة (shutdown, restart, sleep) بنظام تأكيد (yes / no).
            - ⚡ **أزرار سريعة:** إضافة زر 📸 لقطة شاشة وزر 📎 لإرفاق الملفات.
          files: PCRemote-v1.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
