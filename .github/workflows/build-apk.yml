name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk PCRemote-v1.6.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-APK
          path: PCRemote-v1.6.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.6.0
          name: "PC Remote App v1.6.0"
          body: |
            ### 🚀 PC Remote Control Android App (Release v1.6.0)
            - ⚡ **مزامنة الحافظة الفورية في الخلفية بنظام الروت (Precision Background Clipboard Sync):**
              - مزامنة فورية وتلقائية بالكامل بين الحاسوب والهاتف عند خروجك من التطبيق وتصفح أي تطبيق آخر!
              - تشغيل ديمون خفيف عالي الدقة (ClipboardWatcher) بصلاحيات الروت/Shell لمراقبة وتحديث الحافظة في أجزاء من الثانية دون قيود النظام على الخلفية.
              - نسخ أي نص في أي تطبيق على الهاتف يرسله فوراً لحافظة الويندوز، ونسخ أي نص على الويندوز يحدّث حافظة الهاتف فوراً وبلا أي تكرار.
            - 🟢 **خدمة دائمة في الخلفية وإشعار مستمر (PcConnected):**
              - حماية الخدمة من الإغلاق والقتل بواسطة إدارة الطاقة في النظام.
          files: PCRemote-v1.6.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
