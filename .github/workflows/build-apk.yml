name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk PCRemote-v2.0.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-APK
          path: PCRemote-v2.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.0
          name: "PC Remote App v2.0.0"
          body: |
            ### 🚀 PC Remote Control Android App (Release v2.0.0)
            - 🛡️ **تطبيق نظيف، خفيف ومستقر 100% بدون أي تعقيد أو حاجة للروت:**
              - لا يتطلب أي صلاحيات روت أو صلاحيات خاصة على الإطلاق.
              - يعمل كتطبيق قياسي وسريع وفوري ومباشر دون خدمات مزعجة في الخلفية.
            - 📁 **متصفح وسحب ملفات الحاسوب (PC File Explorer):**
              - تصفح أقراص ومجلدات الحاسوب وسحب وتحميل أي ملف بضغطة زر.
              - ترتيب الملفات تلقائياً حسب آخر إضافة وتعديل (الأحدث أولاً).
            - 📸 **التقاط الشاشة المباشر (Multi-Monitor Screenshots):**
              - إرسال لقطات الشاشة مباشرة في المحادثة مع دعم الشاشتين معاً أو اختيار شاشة 1 أو 2.
            - 📎 **إرسال الملفات والصور إلى الحاسوب:**
              - زر إرفاق مباشر وسريع لإرسال أي ملف أو صورة إلى مجلد Downloads على الحاسوب.
              - دعم كامل لقائمة المشاركة الرسمية (Android Share Sheet) لمشاركة أي صورة أو رابط أو ملف من أي تطبيق في الهاتف إلى الحاسوب.
            - ⚡ **أوامر الطاقة الذكية مع تأكيد الأمان ومؤقتات النوم:**
              - تأكيد أمان بنعم/لا قبل تنفيذ أوامر الإيقاف أو إعادة التشغيل لتفادي الضغط بالخطأ.
              - أوامر Sleep المجدولة (sleep 15, sleep 30, rain 15m).
          files: PCRemote-v2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
