name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk PCRemote-v1.1.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-APK
          path: PCRemote-v1.1.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.0
          name: "PC Remote App v1.1.0"
          body: |
            ### 🚀 PC Remote Control Android App (Release v1.1.0)
            - 🔊 اختصارات سريعة للتحكم المباشر في الصوت (s 15, s 25, s 40).
            - 🌧️ وضع تشغيل المطر مع تصغير كافة النوافذ (Desktop فقط).
            - 🐐 زر سريع لتشغيل فيديو Messi.
            - ⚡ أزرار سريعة في الشريط العلوي لتسهيل التحكم بضغطة زر واحدة.
          files: PCRemote-v1.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
