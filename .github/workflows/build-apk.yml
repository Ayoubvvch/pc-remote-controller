name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk PCRemote-v1.4.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-APK
          path: PCRemote-v1.4.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.4.0
          name: "PC Remote App v1.4.0"
          body: |
            ### 🚀 PC Remote Control Android App (Release v1.4.0)
            - 📲 **الظهور في قائمة المشاركة (Android Share Sheet Integration):** يمكنك الآن مشاركة أي صورة أو فيديو أو مستند أو رابط من أي تطبيق في هاتفك (Gallery, WhatsApp, Files, Browser) مباشرة إلى PC Remote ليتم إرساله وحفظه في مجلد Downloads بالحاسوب فوراً!
            - 📁 **متصفح وسحب ملفات الحاسوب (PC File Explorer):** تصفح كافة أقراص ومجلدات الحاسوب (C, D, F, Downloads, Desktop) وسحب/تنزيل أي ملف إلى الهاتف بضغطة زر واحدة.
            - 🖥️ **دعم تصوير الشاشات المتعددة (Multi-Monitor Screenshot):** التقاط الشاشتين معاً في صورة بانورامية كاملة، أو الشاشة الأولى أو الثانية.
            - 🎨 **أيقونة تطبيق مخصصة وجديدة بالكامل.**
          files: PCRemote-v1.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
